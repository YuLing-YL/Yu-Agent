# 默认配置。用户覆盖放 data/config/user.yaml（GUI 设置页写入），优先级：
# 环境变量 > user.yaml > default.yaml
# 密钥一律走环境变量（见 .env.example），不要写在这个文件里。
#
# ⚠️ 键名拼写错误会在启动时直接报错（pydantic extra="forbid"），不会再静默失效。

agent:
  max_steps: 20              # 单个任务最多多少步
  step_timeout_s: 60         # 单步超时：超过即记一次超时（模型调用自身另有 HTTP timeout）
  task_timeout_s: 900        # 单任务总超时：到点强制收尾
  max_consecutive_failures: 3
  # ── 防重复 / 防卡死（避免「一直点停不下来」）──
  max_repeated_actions: 3      # 连续多少次完全相同的动作判定卡住并自动停止
  max_same_action_total: 3     # 同一个目标（位置）累计被点击多少次判定卡住
  max_same_action_total_other: 8   # 同一按键/滚动等动作累计上限（合法连续操作放宽）
  max_total_clicks: 12         # 单个任务点击总预算，超过即自动停止
  max_no_change_steps: 3       # 屏幕连续无变化多少次判定卡住并自动停止
  max_plan_rejects: 2          # 反复「拆分子任务」却不执行任何操作多少次判定死循环并停止
  type_interval_s: 0.02        # 逐字输入时每个字符的间隔（只影响 ASCII；中文走剪贴板粘贴）
  stop_on_grounding_error: true  # 定位失败（GroundingError）时立刻终止；false 则交给失败计数
  # ── 元素标注（SOM）──
  # marks  = 截图上画编号框，模型输出编号（默认，点击最准）
  # coords = 不画框，模型直接给像素坐标（坐标会吸附到最近的元素中心）
  # off    = 完全不枚举元素，纯看图给坐标（最省 token，但最容易点偏）
  som_mode: marks
  som_max_marks: 80            # 单帧最多标多少个元素（含程序坞；60 实测会截断 Electron 应用 59 个）
  som_frontmost_only: true     # 只标「最前面的应用 + 程序坞」，背景窗口的按钮不标
  som_content_check: true      # 用截图像素校准元素框：空框丢弃、过大的框收缩到真实内容
  dry_run: false               # true = 只规划不执行（安全调试）

prompts:
  # 提示词语言：en = 英文（默认，token 更省、指令遵循通常更稳）；zh = 中文
  # 对应文件：en → src/yu_agent/prompts/system.en.md，zh → system.md
  language: en

loop:
  verify_after_action: true  # 动作后是否校验屏幕是否变化
  verify_delay_s: 0.5        # 动作后等待多久再截图对比（太快会把慢渲染误判为无变化）
  screenshot_diff_threshold: 0.002   # 变化像素占比低于此值视为「没反应」
  # ── 结果复核：模型说 done 之后，另起一次调用对着截图确认「真的完成了吗」──
  verify_goal: true          # 关掉就退回「模型说完成就算完成」（不推荐）
  max_goal_rejects: 1        # 复核说没完成时打回重做几次（打回时会告诉模型还差什么）
  # ── 卡住时的重规划（plan 平时只接受一次，这是唯一例外出口）──
  max_replans: 1
  # ── OCR 坐标兜底：AX 里没有的元素，用屏幕文字反查位置（约 0.3s/次，仅兜底时触发）──
  ocr_anchor: true
  # ── OCR 补标注（蓝色框）：AX 读不到的界面靠它兜底 ──
  # Electron / 网页 / 自绘界面 / 没给辅助功能权限的应用，AX 树是空的或多半空的，
  # 红框根本画不出来；这里用 macOS Vision 读屏幕上的文字补一组蓝色编号框。
  # 已经有红框盖住的文字不会重复编号，所以开着也不会让编号表翻倍。
  som_ocr: true
  som_ocr_max: 30            # 单帧最多补多少个 OCR 文字框
  som_ocr_min_conf: 0.30     # Vision 置信度下限（0.3 实测能保住灰字/小字；再低会把图标纹理认成文字）
  som_ocr_skip_ax_elements: 40  # AX 已枚举到这么多元素就跳过 OCR（原生应用不必花这 0.3s；0=总是跑）
  som_dock_max_marks: 20     # 程序坞最多标记几个图标（图标多时不会只标一半）
  som_max_apps: 1            # 最多枚举几个可见应用（som_frontmost_only 开启时固定为 1）
  # ── 运行记录（runs/）：每步截图 + trace.jsonl，事后排障用 ──
  save_trace: true
  runs_keep: 50              # 只保留最近 N 次运行记录，更早的自动清理（0 = 不清理）
  require_approval_for_risky: true   # 删除/发送/支付这类动作是否要人工确认
  # 模型单价（每 1K token，美元）；留空则只统计 token 不折算金额
  model_pricing: {}

perception:
  max_image_side: 1568       # 送模型前缩放，控制 token 成本
  use_som: true              # 是否用 SOM 标记法（编号框）提升点击精度
  a11y_max_depth: 24         # 辅助功能树最大递归深度
  a11y_max_elements: 400     # 单个应用最多枚举多少个元素（防巨型页面拖慢一帧）

grounding:
  text_match_threshold: 0.62    # difflib 相似度阈值（目标描述 → 元素名）
  prefer_a11y_over_pixels: true  # 文本匹配命中时优先用 a11y 元素坐标，而不是模型给的像素
  coords_mode: pixel            # pixel | normalized_1000

safety:
  require_approval_for_risky: true
  deny_shell_by_default: true       # 默认禁止 run_shell 类动作
  forbidden_action_types: [run_shell]
  redact_secrets_in_traces: true    # 写 trace.jsonl 前把 key/token 打码

memory:
  enabled: true
  store: sqlite              # sqlite | memory(测试用)；当前实现固定 sqlite
  sqlite_path: data/memory/yu_agent.sqlite   # 相对项目根；也可写绝对路径
  # L1 工作记忆：上下文预算控制
  working:
    max_recent_steps: 6      # 保留完整细节的最近步数
    max_recent_images: 2     # 最多带几张截图（截图 token 最贵）
    older_steps_as_text: true
  # 检索：GUI 领域用关键词检索即可，暂不引入向量
  retrieval:
    top_k: 5
    min_score: 0.3
    filter_by_app: true      # 按当前前台 App 过滤，避免跨 App 污染
    bm25_weight: 1.0
  # L3 语义记忆：坐标类记录的失效规则
  semantic:
    expire_after_days: 30
    invalidate_on_resolution_change: true   # 分辨率/缩放变了就作废
    require_reverify: true                  # 复用位置前必须重新定位校验
  # L2 程序性记忆
  procedural:
    min_success_streak: 2    # 同一技能连续成功几次才沉淀为模板
    require_verification: true
  # 离线蒸馏：任务结束后统一提炼一次（dry-run 跳过，失败不影响主流程）
  distillation:
    auto_after_task: true    # 任务结束后是否调用模型提炼长期记忆
    keep_failed_as_negative: true   # 失败任务也写情节记忆，但不写技法模板

paths:
  runs_dir: runs
  cache_dir: .cache/vlm
