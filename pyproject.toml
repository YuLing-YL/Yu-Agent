[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "yu-agent"
version = "0.0.1"
description = "基于 VLM 的 GUI Agent：observe -> ground -> act -> verify 闭环"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yu-Agent" }]
keywords = ["gui-agent", "vlm", "computer-use", "automation"]

# 核心依赖 = 「能不能跑起来」的最小集。每一项都对应 src 里的真实 import：
#   pydantic  —— 动作/配置契约（actions/schema.py、settings.py）
#   PyYAML    —— 配置加载（settings.py）
#   Pillow    —— 截图的裁剪/缩放/编码（perception/som.py、common/image.py）
#   requests  —— 唯一的 VLM 客户端（models/openai_vlm.py，OpenAI 兼容接口）
# 故意**不**依赖 openai/anthropic SDK：它们只是另一种 HTTP 封装，
# 走 requests 反而少一层版本兼容问题（见 models/registry.py 的说明）。
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "requests>=2.32",
]

[project.optional-dependencies]
# 桌面控制 + macOS 原生能力（perception/a11y.py、vision_ocr.py、gui/floating.py 都直接 import）
#   Quartz            —— CGWindowList 截屏、窗口 bounds
#   ApplicationServices —— AXUIElement 辅助功能树
#   Cocoa             —— AppKit / Foundation（浮窗置顶、NSWorkspace 前台应用）
#   Vision            —— 原生 OCR，AX 读不到文字时的蓝色标注通道
macos = [
  "pyautogui>=0.9.54",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
  "numpy>=1.26",
  "pyperclip>=1.9; sys_platform != 'darwin'",
]
windows = ["pyautogui>=0.9.54", "pyperclip>=1.9", "numpy>=1.26"]
linux = [
  "pyautogui>=0.9.54",
  "python-xlib>=0.33; sys_platform == 'linux'",
  "pyperclip>=1.9",
  "numpy>=1.26",
]

# 浏览器 / CDP 级控制（比点像素可靠得多，见 env/browser_cdp.py）
browser = ["playwright>=1.44"]

# OCR 兜底（没装 macOS Vision 时退到 tesseract，见 perception/ocr.py）
ocr = ["pytesseract>=0.3.10"]

# 图形界面（gui/ 整个目录）
gui = ["PySide6>=6.6"]

# 开发
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[project.scripts]
yu-agent = "yu_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yu_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "gui: 需要真实屏幕/辅助功能权限，默认跳过（用 RUN_GUI_TESTS=1 打开）",
  "network: 需要真实模型 API key，默认跳过",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]
# 忽略的都是**纯风格**、且在本项目里有明确理由的规则：
# - UP006/UP045/UP035：typing.Dict → dict、Optional[X] → X | None，全仓 500+ 处；
#   文件都开了 `from __future__ import annotations`，运行时无差异，单独开一个提交再做。
# - SIM105：try/except/pass 换成 contextlib.suppress 只是写法偏好，本项目用它做防御式兜底。
# - SIM103/SIM108：可读性偏好，提前 return / if-else 在本项目里更贴业务语义。
# - PTH：os.path → pathlib 属于重构，不是缺陷。
# - B905：zip(strict=) 需要逐个确认两边长度语义，不能机械加。
# - ARG：插件/接口预留参数（如 get_model(role)）是有意的。
ignore = ["E501", "UP006", "UP045", "UP035", "SIM105", "SIM103", "SIM108", "PTH", "B905", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "SLF001"]
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/yu_agent"]
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
# 历史代码里 Any 用得很多，先把「明显的类型错误」挡住（比如标注 -> None 却 return 值）。
# 成熟一块收紧一块：新模块请尽量写全注解。
warn_return_any = false
check_untyped_defs = true

# PySide6 的 stub 只声明了嵌套枚举（Qt.AlignmentFlag.AlignTop、QLineEdit.EchoMode.Password），
# 而 Qt5 兼容的扁平写法（Qt.AlignTop、QLineEdit.Password）在 PySide6 运行时完全可用，
# 只是 mypy 认不出来。逐行加 type: ignore 会让整个 gui 目录被注释淹没，
# 所以这里只对 UI 层放宽——**gui 以外的代码仍然全量检查**。
[[tool.mypy.overrides]]
module = ["yu_agent.gui.*"]
ignore_errors = true
