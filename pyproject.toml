[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "yu-agent"
version = "0.0.1"
description = "基于 VLM 的 GUI Agent：observe -> ground -> act -> verify 闭环"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yu-Agent" }]
keywords = ["gui-agent", "vlm", "computer-use", "automation"]

# 核心依赖保持最小：契约层（pydantic）+ 配置（yaml）+ 图像（pillow）
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
# 桌面控制（按目标平台选装）
macos = [
  "pyautogui>=0.9.54",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
]
windows = ["pyautogui>=0.9.54"]
linux = ["pyautogui>=0.9.54", "python-xlib>=0.33; sys_platform == 'linux'"]

# 浏览器 / DOM 级控制（比点像素可靠得多）
browser = ["playwright>=1.44"]

# OCR（a11y 树拿不到文字时的兜底）
ocr = ["pytesseract>=0.3.10"]

# VLM 后端
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
local = ["requests>=2.32"]

# 图形界面
gui = ["PySide6>=6.6"]

# 开发
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[project.scripts]
yu-agent = "yu_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yu_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "gui: 需要真实屏幕/辅助功能权限，默认跳过（用 RUN_GUI_TESTS=1 打开）",
  "network: 需要真实模型 API key，默认跳过",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "SLF001"]
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["yu_agent"]
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
